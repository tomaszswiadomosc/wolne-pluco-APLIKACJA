<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel trenera · Wolne Płuco</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=1">
<style>
.app.wide{max-width:1100px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft2)}
.lead{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.lead .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.tag.ok{background:#E3F6CF;color:#2F5A08}.tag.no{background:#FBE4E2;color:#8A1F14}
.btn.slim{min-height:40px;padding:0 14px;font-size:14px}
select,input[type=time],input[type=date],input[type=url],input[type=search]{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
</style>
</head>
<body>
<div class="app wide"><main id="m"><div class="loading">Wczytuję…</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=1"></script>
<script src="admin.js?v=4"></script>
</body>
</html>
